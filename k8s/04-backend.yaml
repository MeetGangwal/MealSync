apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mealsync
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mealsync-platform
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-api
    # Internal only (Prometheus scrape); the ingress routes to the frontend service.
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: management
  selector:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealsync-backend
  namespace: mealsync
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mealsync-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: mealsync-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Wait until MySQL accepts TCP connections (it opens 3306 only after initialization),
      # so the backend does not crash-loop on first start.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 mysql 3306; do echo waiting for mysql; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: backend
          image: mealsync-backend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http-api
            - containerPort: 8081
              name: management
          env:
            # ── Server & Runtime Config ──
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: SERVER_PORT
            - name: MANAGEMENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: MANAGEMENT_PORT
            - name: MEALSYNC_SEED_DEMO_USERS
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: MEALSYNC_SEED_DEMO_USERS

            # ── Database Connection (service "mysql") ──
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mealsync-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealsync-secret
                  key: DB_PASSWORD

            # ── JWT Authentication ──
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealsync-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: JWT_EXPIRATION_MS

          # ── Resource Requests & Limits (Required for HPA) ──
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi

          # ── Probes (Actuator on the internal management port) ──
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
