apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mealsync
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mealsync-platform
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-api
  selector:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealsync-backend
  namespace: mealsync
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mealsync-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: mealsync-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: mealsync-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http-api
          env:
            # ── Server & Runtime Config ──
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: SERVER_PORT
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: SPRING_PROFILES_ACTIVE

            # ── Database Connection ──
            # Defaults to DB_URL (MySQL: jdbc:mysql://mysql:3306/mealsync).
            # If testing against PostgreSQL, change key to POSTGRES_DB_URL.
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mealsync-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealsync-secret
                  key: DB_PASSWORD

            # ── JWT Authentication ──
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealsync-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: mealsync-config
                  key: JWT_EXPIRATION_MS

          # ── Resource Requests & Limits (Required for HPA) ──
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi

          # ── Probes ──
          # Uses tcpSocket because Spring Boot Actuator is not yet present in
          # backend/pom.xml. Once Actuator is merged, switch to httpGet /actuator/health.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
