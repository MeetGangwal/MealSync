# ─────────────────────────────────────────────────────────────────────────────
# MealSync — Kubernetes Secret Template (Example)
# DO NOT COMMIT REAL CREDENTIALS OR JWT SECRETS INTO VERSION CONTROL.
#
# Production / Local deployment method:
# Option 1 (Recommended Imperative command):
#   kubectl create secret generic mealsync-secret \
#     --namespace=mealsync \
#     --from-literal=DB_USERNAME="mealsync_user" \
#     --from-literal=DB_PASSWORD="<STRONG_PASSWORD>" \
#     --from-literal=DB_ROOT_PASSWORD="<STRONG_ROOT_PASSWORD>" \
#     --from-literal=JWT_SECRET="<MIN_32_BYTES_HEX_OR_BASE64_KEY>" \
#     --from-literal=GRAFANA_ADMIN_PASSWORD="<STRONG_ADMIN_PASSWORD>"
#
# Option 2 (Declarative):
#   cp 02-secret.example.yaml 02-secret.yaml
#   # Edit 02-secret.yaml with real base64 or plaintext stringData values
#   # Ensure 02-secret.yaml is in .gitignore
#   kubectl apply -f 02-secret.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mealsync-secret
  namespace: mealsync
  labels:
    app.kubernetes.io/name: mealsync
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: mealsync-platform
type: Opaque
stringData:
  # Database credentials
  DB_USERNAME: "mealsync_user"
  DB_PASSWORD: "change_me_db_password"
  DB_ROOT_PASSWORD: "change_me_root_password"

  # JWT signing secret (HMAC-SHA256, minimum 256 bits / 32 bytes)
  # Generate using: openssl rand -hex 32
  JWT_SECRET: "change_me_jwt_secret_min_32_bytes_length_here_12345"

  # Grafana admin credentials
  GRAFANA_ADMIN_PASSWORD: "change_me_grafana_password"
