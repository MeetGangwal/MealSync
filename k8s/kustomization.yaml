apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mealsync

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 03-mysql.yaml
  - 04-backend.yaml
  - 05-frontend.yaml
  - 06-ingress.yaml
  - 07-hpa.yaml
  - 08-monitoring.yaml

# The Secret "mealsync-secret" is NOT part of this kustomization, so applying it can
# never overwrite real credentials with placeholders. Create it first (see README.md):
#   kubectl create secret generic mealsync-secret -n mealsync --from-env-file=<your .env>
