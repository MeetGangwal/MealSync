apiVersion: v1
kind: ConfigMap
metadata:
  name: mealsync-config
  namespace: mealsync
  labels:
    app.kubernetes.io/name: mealsync
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: mealsync-platform
data:
  # Spring Boot server configuration
  SERVER_PORT: "8080"
  MANAGEMENT_PORT: "8081"

  # Database configuration (Kubernetes internal service DNS)
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "mealsync"
  # Authentication token settings
  JWT_EXPIRATION_MS: "86400000"

  # Demo accounts are never seeded in the cluster
  MEALSYNC_SEED_DEMO_USERS: "false"

  # Observability settings
  GRAFANA_ADMIN_USER: "admin"
