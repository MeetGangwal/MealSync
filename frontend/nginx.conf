server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck endpoint for Docker / load-balancer probes
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy API calls to the backend container.
    # In production the frontend makes calls to /api/*; Nginx forwards them
    # to the backend service on the internal Docker network.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — return index.html for any unknown path so React Router
    # can handle client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
        # Revalidate the HTML shell (and public images) so a new deployment's hashed bundles are
        # picked up instead of a stale cached index.html. Headers set here replace the server-level
        # ones, so the security headers are repeated.
        add_header Cache-Control          "no-cache"      always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;
}
