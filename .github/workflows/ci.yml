name: MealSync CI Pipeline

# Runs the same checks that are run locally. Nothing here deploys anywhere or
# talks to a cloud provider. Image publishing to Docker Hub is opt-in (see the
# last job).

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege permissions by default
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend: compile, unit tests, MySQL integration tests ───────────────
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Integration tests start MySQL 8.4 with Testcontainers (Docker is available on ubuntu runners)
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ── 2. Frontend: lint + production build ────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── 3. Infrastructure configuration checks (validation only) ────────────────
  infra:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose --env-file .env.example config -q

      - name: Kubernetes manifests (kustomize render + kubeconform)
        run: |
          kubectl kustomize k8s > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 - < rendered.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt + validate (no backend, no apply)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive -diff
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ansible syntax check + lint
        working-directory: infra/ansible
        run: |
          pip install "ansible-core==2.17.7" "ansible-lint==24.12.2"
          ansible-galaxy collection install -r requirements.yml
          for pb in playbooks/*.yml; do ansible-playbook --syntax-check "$pb"; done
          ansible-lint --offline playbooks/

  # ── 4. Container images (built, not pushed) ─────────────────────────────────
  docker-build:
    name: Docker image builds
    needs: [backend, frontend, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend and frontend images
        run: docker compose --env-file .env.example build backend frontend

  # ── 5. End-to-end: full Compose stack + smoke test + short load test ────────
  e2e:
    name: End-to-end (Compose stack)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Throwaway random secrets for this runner only (never stored or printed)
      - name: Create .env for CI
        run: |
          cp .env.example .env
          for key in DB_PASSWORD DB_ROOT_PASSWORD JWT_SECRET GRAFANA_ADMIN_PASSWORD; do
            sed -i "s|^$key=.*|$key=$(openssl rand -hex 32)|" .env
          done

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test (frontend -> API -> MySQL)
        run: bash scripts/smoke-test.sh http://localhost:3000

      - name: Prometheus scrapes the backend
        run: |
          for _ in $(seq 1 12); do
            if curl -s http://127.0.0.1:9090/api/v1/targets | grep -q '"job":"mealsync-backend".*"health":"up"'; then
              echo "mealsync-backend target is up"; exit 0
            fi
            sleep 5
          done
          echo "mealsync-backend target not up"; exit 1

      - name: Load test (k6, short)
        run: |
          docker run --rm -i --network host -e BASE_URL=http://localhost:3000 -e VUS=10 -e DURATION=15s \
            grafana/k6:1.3.0 run --quiet - < infra/load-testing/k6-test.js

      - name: Container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100 backend frontend db

  # ── 6. Optional: publish images to Docker Hub ───────────────────────────────
  # Disabled until you opt in: set the repository variable DOCKERHUB_PUBLISH=true
  # and the secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN. Runs only on main.
  publish:
    name: Publish images (optional)
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for svc in backend frontend; do
            docker build -t "$REPO/mealsync-$svc:${GITHUB_SHA::7}" -t "$REPO/mealsync-$svc:latest" "./$svc"
            docker push "$REPO/mealsync-$svc:${GITHUB_SHA::7}"
            docker push "$REPO/mealsync-$svc:latest"
          done
