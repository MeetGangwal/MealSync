name: MealSync CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege permissions by default
permissions:
  contents: read

jobs:
  # ── 1. Frontend Verification ────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend application (Vite)
        working-directory: frontend
        run: npm run build

      - name: Verify build artifacts
        working-directory: frontend
        run: |
          test -d dist || { echo "dist/ directory missing!"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          echo "Frontend build verified successfully."

  # ── 2. Backend Verification ─────────────────────────────────────────────────
  backend-ci:
    name: Backend Compile & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Verify compilation and dependency resolution
        working-directory: backend
        run: ./mvnw clean test-compile -B

      - name: Package fat JAR (skip DB-dependent integration tests)
        working-directory: backend
        run: ./mvnw package -DskipTests -B

      - name: Verify generated JAR
        working-directory: backend
        run: |
          ls -lh target/*.jar
          test -f target/*.jar || { echo "Backend fat JAR not found!"; exit 1; }
          echo "Backend package verified successfully."

  # ── 3. Infrastructure & Manifest Validation ──────────────────────────────────
  infra-lint:
    name: Infrastructure Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Kubernetes Manifests
        run: |
          python -c "
          import yaml, glob, sys
          files = glob.glob('k8s/*.yaml') + glob.glob('k8s/*.yml')
          print(f'Validating {len(files)} Kubernetes files...')
          errors = 0
          for f in sorted(files):
              try:
                  with open(f, 'r') as fp:
                      list(yaml.safe_load_all(fp))
                  print(f'  [PASS] {f}')
              except Exception as e:
                  print(f'  [FAIL] {f}: {e}')
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('All Kubernetes YAML files are syntactically valid.')
          "

      - name: Validate Ansible Playbooks & Roles
        run: |
          python -c "
          import yaml, glob, sys
          files = glob.glob('infra/ansible/**/*.yml', recursive=True) + glob.glob('infra/ansible/**/*.yaml', recursive=True)
          print(f'Validating {len(files)} Ansible files...')
          errors = 0
          for f in sorted(files):
              try:
                  with open(f, 'r') as fp:
                      list(yaml.safe_load_all(fp))
                  print(f'  [PASS] {f}')
              except Exception as e:
                  print(f'  [FAIL] {f}: {e}')
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('All Ansible YAML files are syntactically valid.')
          "

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Validate Terraform Format
        working-directory: infra/terraform
        run: terraform fmt -check -diff

  # ── 4. Docker Build Verification ─────────────────────────────────────────────
  docker-build:
    name: Docker Image Builds
    needs: [frontend-ci, backend-ci, infra-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image (Dry-Run / No Push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: mealsync-frontend:ci-test

      - name: Build Backend Docker Image (Dry-Run / No Push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: mealsync-backend:ci-test

  # ── 5. Optional Registry Publishing ─────────────────────────────────────────
  docker-publish:
    name: Publish Images to Container Registry
    needs: [docker-build]
    runs-on: ubuntu-latest
    # Publish ONLY on main branch push AND only if registry secrets are present
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.DOCKERHUB_USERNAME != '' &&
      secrets.DOCKERHUB_TOKEN != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mealsync-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mealsync-frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mealsync-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mealsync-backend:${{ github.sha }}
