# ─────────────────────────────────────────────────────────────────────────────
# MealSync — Docker Compose (local development and verification)
#
# Stack: MySQL 8.4, Spring Boot backend, React/Nginx frontend, Prometheus,
# cAdvisor and Grafana.
#
# SECRETS ────────────────────────────────────────────────────────────────────
# Copy .env.example to .env and fill in real values before starting.
# .env is git-ignored. Never commit it. Required values fail fast if missing.
#
# START ──────────────────────────────────────────────────────────────────────
#   cp .env.example .env   # then edit .env
#   docker compose up -d --build
#
# PORTS (host; override in .env if a port is already taken) ──────────────────
#   FRONTEND_HOST_PORT   3000  frontend (also proxies /api to the backend)
#   BACKEND_HOST_PORT    8080  backend API (direct, for local testing)
#   PROMETHEUS_HOST_PORT 9090, GRAFANA_HOST_PORT 3001, CADVISOR_HOST_PORT 8090
#                              (bound to 127.0.0.1 only)
#   The backend management port 8081 (health + metrics) is NOT published.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database (MySQL 8.4) ───────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: mealsync-db
    cgroup_parent: /mealsync/db   # names this service in cAdvisor metrics
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-mealsync}
      MYSQL_USER:          ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD:      ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - mealsync-net
    healthcheck:
      # MYSQL_PWD keeps the password off the command line / process list
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mealsync-backend:${IMAGE_TAG:-local}
    container_name: mealsync-backend
    cgroup_parent: /mealsync/backend   # names this service in cAdvisor metrics
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Database (Compose service name "db") ─────────────────────────────
      DB_HOST:     db
      DB_PORT:     "3306"
      DB_NAME:     ${DB_NAME:-mealsync}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # ── JWT ──────────────────────────────────────────────────────────────
      JWT_SECRET:        ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # ── Server / management (8081 stays internal: Prometheus + healthcheck) ─
      SERVER_PORT:     "8080"
      MANAGEMENT_PORT: "8081"
      # ── Demo accounts: off unless explicitly enabled in .env ─────────────
      MEALSYNC_SEED_DEMO_USERS:       ${MEALSYNC_SEED_DEMO_USERS:-false}
      MEALSYNC_DEMO_STUDENT_PASSWORD: ${MEALSYNC_DEMO_STUDENT_PASSWORD:-}
      MEALSYNC_DEMO_ADMIN_PASSWORD:   ${MEALSYNC_DEMO_ADMIN_PASSWORD:-}
      # ── First administrator: promotes an already-registered account ──
      MEALSYNC_BOOTSTRAP_ADMIN_EMAIL: ${MEALSYNC_BOOTSTRAP_ADMIN_EMAIL:-}
      MEALSYNC_TIME_ZONE:             ${MEALSYNC_TIME_ZONE:-Asia/Kolkata}
    ports:
      # API exposed directly for local development/testing; remove in production
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - mealsync-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── React Frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mealsync-frontend:${IMAGE_TAG:-local}
    container_name: mealsync-frontend
    cgroup_parent: /mealsync/frontend   # names this service in cAdvisor metrics
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - mealsync-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]   # IPv4 (localhost resolves to ::1)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mealsync-prometheus
    cgroup_parent: /mealsync/prometheus   # names this service in cAdvisor metrics
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      # Bound to localhost only — not exposed to the internet
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - mealsync-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── cAdvisor (container metrics) ─────────────────────────────────────────
  # Reads per-service cgroups (/mealsync/<service>, set via cgroup_parent) directly.
  # The Docker socket is not mounted: cAdvisor's Docker integration cannot read
  # Docker Desktop's containerd image store, and raw cgroups need no Docker access.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: mealsync-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--docker_only=false"
      - "--raw_cgroup_prefix_whitelist=/mealsync/"
      - "--housekeeping_interval=10s"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
    ports:
      - "127.0.0.1:${CADVISOR_HOST_PORT:-8090}:8080"
    networks:
      - mealsync-net

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: mealsync-grafana
    cgroup_parent: /mealsync/grafana   # names this service in cAdvisor metrics
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:${GRAFANA_HOST_PORT:-3001}"
      # Disable telemetry
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Bound to localhost only
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    networks:
      - mealsync-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  db-data:
    name: mealsync-db-data
  prometheus-data:
    name: mealsync-prometheus-data
  grafana-data:
    name: mealsync-grafana-data

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  mealsync-net:
    name: mealsync-network
    driver: bridge
