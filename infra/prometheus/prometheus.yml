global:
  scrape_interval:     15s   # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout:      10s
  external_labels:
    project: mealsync
    env:     local

# ── Alerting ─────────────────────────────────────────────────────────────────
# (No alertmanager configured yet — add in a future milestone)

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Container metrics via cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    metric_relabel_configs:
      # Keep machine-level series (no id, e.g. machine_memory_bytes), the host total ("/")
      # and one series per MealSync service ("/mealsync/<service>"); drop nested
      # per-container duplicates and unrelated host/WSL cgroups.
      - source_labels: [id]
        regex: '|/|/mealsync/[^/]+'
        action: keep
      - source_labels: [id]
        regex: '/mealsync/([^/]+)'
        target_label: service
        replacement: '$1'

  # ── Spring Boot Actuator / Micrometer ──────────────────────────────────────
  # Internal management port 8081 (not published to the host).
  - job_name: mealsync-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
