---
# ─────────────────────────────────────────────────────────────────────────────
# MealSync Ansible Role — Application Kubernetes Deployment
# ─────────────────────────────────────────────────────────────────────────────

- name: Create MealSync remote deployment directory
  ansible.builtin.file:
    path: "{{ mealsync_remote_k8s_dir }}"
    state: directory
    mode: '0755'

- name: Sync Kubernetes manifests to target host
  ansible.builtin.copy:
    src: "{{ mealsync_k8s_source_dir }}/"
    dest: "{{ mealsync_remote_k8s_dir }}/"
    mode: '0644'

- name: Ensure mealsync namespace exists
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/00-namespace.yaml"
  changed_when: false

- name: Create or update mealsync-secret securely from inventory variables
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create secret generic mealsync-secret \
      --namespace={{ mealsync_namespace }} \
      --from-literal=DB_USERNAME="{{ db_username }}" \
      --from-literal=DB_PASSWORD="{{ db_password }}" \
      --from-literal=DB_ROOT_PASSWORD="{{ db_root_password }}" \
      --from-literal=JWT_SECRET="{{ jwt_secret }}" \
      --from-literal=GRAFANA_ADMIN_PASSWORD="{{ grafana_admin_password }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true # Protect credentials from appearing in Ansible task output logs

- name: Apply MealSync ConfigMap
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/01-configmap.yaml"
  changed_when: true

- name: Apply Database StatefulSet (MySQL)
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/03-mysql.yaml"
  changed_when: true

- name: Apply Spring Boot Backend Deployment & Service
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/04-backend.yaml"
  changed_when: true

- name: Apply React Frontend Deployment & Service
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/05-frontend.yaml"
  changed_when: true

- name: Apply Ingress & NodePort Service
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/06-ingress.yaml"
  changed_when: true

- name: Apply Monitoring Stack (Prometheus & Grafana)
  ansible.builtin.command:
    cmd: kubectl apply -f "{{ mealsync_remote_k8s_dir }}/08-monitoring.yaml"
  changed_when: true

- name: Verify Backend Deployment rollout status
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/mealsync-backend -n {{ mealsync_namespace }} --timeout=180s
  register: backend_rollout
  changed_when: false
  failed_when: false

- name: Verify Frontend Deployment rollout status
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/mealsync-frontend -n {{ mealsync_namespace }} --timeout=120s
  register: frontend_rollout
  changed_when: false
  failed_when: false
