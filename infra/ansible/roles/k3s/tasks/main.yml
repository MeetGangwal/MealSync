---
# ─────────────────────────────────────────────────────────────────────────────
# MealSync Ansible Role — K3s Lightweight Kubernetes Setup
# ─────────────────────────────────────────────────────────────────────────────

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_dest }}"
    mode: '0755'
  when: not k3s_binary.stat.exists

- name: Install K3s server
  ansible.builtin.command:
    cmd: "{{ k3s_install_script_dest }} {{ k3s_server_args }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Ensure K3s service is running and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Ensure .kube directory exists for user
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ubuntu') }}/.kube"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: '0700'

- name: Copy k3s kubeconfig to user .kube/config
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: '0600'

- name: Wait for Kubernetes node to be ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready node --all --timeout=60s
  changed_when: false
