# ─────────────────────────────────────────────────────────────────────────────
# MealSync — Example Ansible INI Inventory
# NOTE: Replace placeholder IPs with your Terraform instance_public_ip output.
# DO NOT COMMIT REAL PRODUCTION HOST CREDENTIALS.
# ─────────────────────────────────────────────────────────────────────────────

[k8s_nodes]
# Documentation IP (RFC 5737 TEST-NET-3)
node1 ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/mealsync-key.pem

[webservers]
node1

[appservers]
node1

[dbservers]
node1

[all:vars]
ansible_python_interpreter=/usr/bin/python3
